# multipass dual-stack forwarding. IPv4 forwarding already exists in
# 90-router.conf; this adds the IPv6 side. Merge into 90-router.conf on jax
# rather than keeping a separate file (etckeeper tracks that file).
net.ipv6.conf.all.forwarding=1
# jax's WAN learns its default route via RA (IPv6AcceptRA=yes). Forwarding
# disables RA acceptance by default; accept_ra=2 keeps the WAN default route.
net.ipv6.conf.enp5s0f1np1.accept_ra=2
