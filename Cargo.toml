[workspace]
resolver = "3"
members = [
    "crates/multipass",
    "crates/multipass-proto",
    "crates/multipass-server",
]

[workspace.dependencies]
base64 = "0.22.1"
parking_lot = "0.12.5"
bytes = "1.12.1"
noq = "1.1.1"
noq-proto = "1.1.1"
rcgen = "0.14.8"
rustls = "0.23.43"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
libc = "0.2"
n0-error = "1.0.0"
facet = { version = "0.50.0-rc.5", features = ["net"] }
facet-json = "0.50.0-rc.5"

[profile.release]
lto = true
codegen-units = 1
