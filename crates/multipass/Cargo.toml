[package]
name = "multipass"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "MIT OR Apache-2.0"
description = "Dynamic N-uplink roaming VPN client daemon and transport"
default-run = "multipassd"

[dependencies]
multipass-proto = { path = "../multipass-proto" }
bytes.workspace = true
base64.workspace = true
noq.workspace = true
noq-proto.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
n0-error.workspace = true
facet.workspace = true
facet-json.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9.4"
core-foundation-sys = "0.8.7"
system-configuration = "0.7.0"

[[bin]]
name = "multipass-linux-client"
path = "src/bin/multipass-linux-client/main.rs"
required-features = ["linux-client"]

[features]
linux-client = []
